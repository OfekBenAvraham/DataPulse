<div class="card">
  <img [src]="item.image" alt="{{ item.title }}" />
  <h3>{{ item.title }}</h3>
  <button
    class="download-btn"
    (click)="onDownload()"
    [disabled]="isLoading() || isSuccess()"
  >
    <ng-container *ngIf="!isLoading() && !isSuccess()">Download</ng-container>
    <div class="spinner" *ngIf="isLoading()"></div>
    <span class="checkmark" *ngIf="isSuccess()">✔</span>
  </button>
</div>
